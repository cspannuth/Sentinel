[package]
name = "sentinel"
version = "0.1.0"
edition = "2024"
description = "Local-first static file inspection with hashes, PE analysis, and YARA-X signatures"
publish = false

[dependencies]
goblin = { version = "0.10", default-features = false, features = ["std", "pe32", "pe64"] }
scroll = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
yara-x = { version = "1.21", default-features = false }

[dev-dependencies]
tempfile = "3"
